basePath: /
definitions:
  dto.AdminAddReq:
    properties:
      email:
        description: 校验邮箱格式
        type: string
      mobile:
        description: 中国手机号通常11位
        type: string
      name:
        maxLength: 20
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
      real_name:
        maxLength: 20
        type: string
    required:
    - email
    - mobile
    - name
    - password
    type: object
  dto.AdminLoginReq:
    properties:
      name:
        maxLength: 64
        type: string
      password:
        minLength: 6
        type: string
    required:
    - name
    - password
    type: object
  dto.AdminLoginResp:
    properties:
      role:
        example: admin
        type: string
      token:
        description: 可以顺手加个 example
        example: 'eyJhbGciOiJIUzI1Ni... '
        type: string
    type: object
  dto.AdminStatusReq:
    properties:
      status:
        enum:
        - 1
        - 2
        type: integer
    type: object
  dto.AuthorAddReq:
    properties:
      email:
        type: string
      mobile:
        type: string
      name:
        description: 登录名
        maxLength: 20
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
      pen_name:
        description: 独有字段：必须有笔名
        maxLength: 64
        type: string
      real_name:
        maxLength: 20
        type: string
    required:
    - email
    - mobile
    - name
    - password
    - pen_name
    type: object
  dto.AuthorListResp:
    properties:
      list:
        description: 文章列表
        items:
          $ref: '#/definitions/dto.AuthorSimple'
        type: array
      page:
        description: 当前页码
        type: integer
      total:
        description: 总记录数
        type: integer
    type: object
  dto.AuthorSimple:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      mobile:
        type: string
      pen_name:
        type: string
      position:
        type: string
    type: object
  dto.CategoryAddReq:
    properties:
      description:
        maxLength: 128
        type: string
      name:
        maxLength: 128
        type: string
    required:
    - name
    type: object
  dto.CategoryListResp:
    properties:
      list:
        description: 文章列表
        items:
          $ref: '#/definitions/dto.CategorySimple'
        type: array
      page:
        description: 当前页码
        type: integer
      total:
        description: 总记录数
        type: integer
    type: object
  dto.CategorySimple:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.PostAddReq:
    properties:
      bd_target_author_id:
        description: == supreme admin only
        type: integer
      category_id:
        type: integer
      content:
        maxLength: 50000
        type: string
      cover:
        maxLength: 2048
        type: string
      keywords:
        maxLength: 255
        type: string
      published_at:
        description: 'RFC3339 "published_at": "2026-02-27T18:00:00+08:00"'
        maxLength: 30
        type: string
      slug:
        maxLength: 100
        type: string
      subtitle:
        maxLength: 150
        type: string
      summary:
        maxLength: 255
        type: string
      tags:
        description: |-
          Tags 是切片，需要双重限制：限制切片元素个数，以及限制每个元素的长度
          max=10 表示最多 10 个标签
          dive 表示深入到切片内部验证
          后面的 max=30 表示每个标签字符串最多 30 个字符
        items:
          type: string
        maxItems: 10
        type: array
      title:
        maxLength: 100
        type: string
    required:
    - category_id
    - content
    - title
    type: object
  dto.PostListResp:
    properties:
      list:
        description: 文章列表
        items:
          $ref: '#/definitions/dto.PostSimple'
        type: array
      page:
        description: 当前页码
        type: integer
      total:
        description: 总记录数
        type: integer
    type: object
  dto.PostSimple:
    properties:
      author:
        $ref: '#/definitions/dto.AuthorSimple'
      author_id:
        description: |-
          关联作者 (Belongs To)
          这里的 Admin 对应你之前的 Admin/User 结构体
        type: integer
      category_id:
        description: |-
          关联分类 (Belongs To)
          一篇文章通常属于一个主分类
        type: integer
      category_name:
        type: string
      content:
        type: string
      cover:
        description: |-
          视觉相关
          列表页展示的封面图，不是正文里的图w
        type: string
      id:
        type: integer
      keywords:
        type: string
      published_at:
        type: string
      read_count:
        type: integer
      slug:
        type: string
      status:
        description: Status Control
        type: integer
      subtitle:
        type: string
      summary:
        type: string
      tags:
        description: |-
          关联标签 (Many To Many)
          一篇文章可以有多个标签
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  dto.PostStatusReq:
    properties:
      id:
        type: integer
      status:
        enum:
        - 0
        - 1
        - 2
        type: integer
    required:
    - id
    - status
    type: object
  dto.PostUpdateReq:
    properties:
      bd_Target_published_at:
        maxLength: 30
        type: string
      bd_target_author_id:
        description: == supreme admin only
        type: integer
      category_id:
        description: 分类通常是必填的，即使不改也要传原值
        type: integer
      content:
        maxLength: 50000
        type: string
      cover:
        maxLength: 2048
        type: string
      id:
        type: integer
      keywords:
        maxLength: 255
        type: string
      slug:
        maxLength: 100
        type: string
      status:
        description: 状态 (例如想把已发布改为草稿)
        enum:
        - 0
        - 1
        - 2
        type: integer
      subtitle:
        maxLength: 150
        type: string
      summary:
        maxLength: 255
        type: string
      tags:
        description: 标签 ID 列表 (全量覆盖)
        items:
          type: string
        maxItems: 10
        type: array
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - category_id
    - content
    - title
    type: object
  dto.UploadImageResp:
    properties:
      url:
        type: string
    type: object
  model.ResponseJson:
    properties:
      code:
        description: used to indicate error to front-end engineer
        type: integer
      data: {}
      msg:
        description: message to front-end user
        type: string
      status:
        description: 0 means not set, use default status code
        type: integer
      total:
        type: integer
    type: object
host: localhost:8888
info:
  contact: {}
  description: This is a sample server Petstore server.
  version: "1.0"
paths:
  /api/v1/author/{name_or_id}:
    get:
      description: 根据作者 ID 或名称 (PenName/Username) 获取作者详情。支持灵活查询。
      parameters:
      - description: Author Name or ID
        in: path
        name: name_or_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取作者详情成功
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Get author details
      tags:
      - Author
  /api/v1/authors:
    get:
      description: 分页获取作者列表
      parameters:
      - default: 1
        description: Page Number (页码，默认 1)
        in: query
        name: page
        type: integer
      - default: 10
        description: Page Size (每页数量，默认 10)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取作者列表成功
          schema:
            allOf:
            - $ref: '#/definitions/model.ResponseJson'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthorListResp'
              type: object
      summary: Get author list
      tags:
      - Author
  /api/v1/categories:
    get:
      description: 分页获取分类列表
      parameters:
      - default: 1
        description: Page Number (页码，默认 1)
        in: query
        name: page
        type: integer
      - default: 10
        description: Page Size (每页数量，默认 10)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取分类列表成功
          schema:
            allOf:
            - $ref: '#/definitions/model.ResponseJson'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryListResp'
              type: object
      summary: Get category list
      tags:
      - Category
  /api/v1/category/{name_or_id}:
    get:
      description: 根据分类 ID 或分类名称获取分类详情。支持灵活查询
      parameters:
      - description: Category ID or Name (分类的 ID 或名称)
        in: path
        name: name_or_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取分类详情成功
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Get category details
      tags:
      - Category
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: |-
        **业务错误码 (Code) 说明：**
        - `401003` - 用户名或密码错误
        - `401004` - 该账号已被冻结，禁止登录
      parameters:
      - description: 登录请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.AdminLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/model.ResponseJson'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminLoginResp'
              type: object
      summary: Login
      tags:
      - Admin
  /api/v1/post/{slug_or_id}:
    get:
      description: '** url参数可以为slug或id **'
      parameters:
      - description: Post ID or Slug
        in: path
        name: slug_or_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            type: "200"
      summary: Get post details
      tags:
      - Post
  /api/v1/posts:
    get:
      consumes:
      - application/json
      description: |-
        获取文章列表（支持分页）。
        注意：为了优化传输性能，列表接口返回的 Post 对象不包含 Content (文章正文)。
      parameters:
      - default: 1
        description: '页码 (默认: 1)'
        in: query
        name: page
        type: integer
      - default: 10
        description: '每页数量 (默认: 10, 最大: 100)'
        in: query
        name: page_size
        type: integer
      - description: Search Keyword
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取列表成功
          schema:
            allOf:
            - $ref: '#/definitions/model.ResponseJson'
            - properties:
                data:
                  $ref: '#/definitions/dto.PostListResp'
              type: object
      summary: Get post list
      tags:
      - Post
  /api/v1/private/admin/{id}:
    delete:
      description: only allow supreme admin(Role=999) do this.
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: admin ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应。实际返回值为 Msg: ''delete Admin status successfully'''
          schema:
            type: "200"
      summary: Delete an admin
      tags:
      - Admin
  /api/v1/private/admin/{id}/status:
    patch:
      consumes:
      - application/json
      description: only allow supreme admin(Role=999) do this. 1--active 2--disabled.
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: admin ID
        in: path
        name: id
        required: true
        type: string
      - description: status
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.AdminStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应。实际返回值为 Msg: ''update Admin status successfully''}'
          schema:
            type: "200"
      summary: update an admin status
      tags:
      - Admin
  /api/v1/private/admin/author:
    post:
      consumes:
      - application/json
      description: |-
        ** 添加admin表**
        ** ---- 业务错误码（Cpde）说明 ---- **
        -401005
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Author Info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AuthorAddReq'
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应。注意：实际返回值为 Code: 20100, Msg: ''create a new Author successfully'''
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Create normal user (author)
      tags:
      - Admin
  /api/v1/private/admin/supreme:
    post:
      consumes:
      - application/json
      description: |-
        ** 任意添加admin表【！！非业务】**
        ** ---- 业务错误码（Cpde）说明 ---- **
        -401005
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Admin Info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AdminAddReq'
      produces:
      - application/json
      responses:
        "200":
          description: '成功响应。注意：实际返回值为 Code: 20100, Msg: ''create a new Admin successfully'''
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Create admin (admin)
      tags:
      - Admin
  /api/v1/private/admins:
    get:
      description: paginate admin. Requires super admin privileges (role=999).
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Page Number
        in: query
        name: page
        type: integer
      - description: Page Size
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: Successfully retrieved admin list
          schema:
            type: "200"
        "400":
          description: Invalid URL parameters
          schema:
            $ref: '#/definitions/model.ResponseJson'
        "403":
          description: Permission denied
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Get admin list
      tags:
      - Admin
  /api/v1/private/category:
    post:
      consumes:
      - application/json
      description: |-
        创建一个新分类。
        权限要求：仅限系统管理员 (Role=Admin) 可以执行此操作。
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Post Info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CategoryAddReq'
      produces:
      - application/json
      responses:
        "200":
          description: create a new category successfully
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Create a new category
      tags:
      - Category
  /api/v1/private/category/{id}:
    delete:
      description: |-
        删除指定的分类
        权限要求：通常仅限系统管理员 (Role=Admin) 可以执行此操作。
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Delete a category
      tags:
      - Category
  /api/v1/private/common/uploadimg:
    post:
      consumes:
      - multipart/form-data
      description: 统一图片上传接口 (支持 Markdown 编辑器自动上传)
      parameters:
      - description: 图片文件
        in: formData
        name: file
        required: true
        type: file
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.ResponseJson'
            - properties:
                data:
                  $ref: '#/definitions/dto.UploadImageResp'
              type: object
      summary: Upload Image
      tags:
      - Common
  /api/v1/private/post:
    post:
      consumes:
      - application/json
      description: |-
        - 可以指定slug，但建议置为空，让程序自动生成
        - published_at: 发布时间,RFC3339格式："2006-01-02T15:04:05Z07:00" 。若留空则默认为当前时间。
        - 后门字段bd_target_author_id,仅当超级管理员时生效
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Post Info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PostAddReq'
      responses:
        "200":
          description: OK
          schema:
            type: "200"
      summary: Create a new post
      tags:
      - Post
  /api/v1/private/post/{id}:
    delete:
      description: |-
        删除指定的文章（注意：此操作为软删除，数据仍在数据库中，只是被标记为已删除）。
        权限要求：仅限文章原作者或系统管理员(Role=Admin)可以执行此操作。
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: delete Post status successfully / 删除成功
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Delete a post
      tags:
      - Post
    put:
      consumes:
      - application/json
      description: |
        更新文章内容。支持部分更新（动态 PATCH 逻辑）：前端只需传入需要修改的字段，未传入的字段将保持原样。
        注意：不支持修改文章作者。仅限文章原作者或系统管理员操作。
        - 后门字段bd_target_author_id, bd_Target_published_at仅当超级管理员时生效
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Info(仅传需要修改的字段)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PostUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: update successfully
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Update a post
      tags:
      - Post
  /api/v1/private/post/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update status field
      parameters:
      - description: Bearer Token
        in: header
        name: Authorization
        type: string
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PostStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: update successfully
          schema:
            $ref: '#/definitions/model.ResponseJson'
      summary: Change post status
      tags:
      - Post
swagger: "2.0"
